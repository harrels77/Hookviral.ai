<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand mark — aligned on the 2026-07 design system: raspberry→violet
       brand gradient (dark-theme variant for contrast on the near-black tile),
       same radius language as the UI (r-lg). H stays readable at 16×16. -->
  <defs>
    <linearGradient id="hv-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#FF3D71"/>
      <stop offset="100%" stop-color="#9B6BFF"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#101019"/>
  <rect x="17" y="14" width="7"  height="36" fill="url(#hv-grad)" rx="2"/>
  <rect x="40" y="14" width="7"  height="36" fill="url(#hv-grad)" rx="2"/>
  <rect x="17" y="29" width="30" height="7"  fill="url(#hv-grad)" rx="2"/>
</svg>
